site_name: GAWP

theme:
  name: "readthedocs"

extra_css:
  - css/gawp.css

markdown_extensions:
  - footnotes
  - def_list
  - admonition
  - toc:
      toc_depth: 2

plugins:
  - search
  - mkdocstrings

nav:
  - "Home":
    - index.md
  - "Installation":
    - install.md
  - "Tutorial":
    - tutorial.md
  - "Overview":
    - overview.md
    - config.md
    - manager_intro.md
  - "Plugins":
    - io.md
    - geometry.md
    - join.md
    - group.md
    - stages.md
    - manager.md
  - "Developer":
    - dev.md
