site_name: GAWP

theme:
  name: "readthedocs"

extra_css:
  - css/gawp.css

markdown_extensions:
  - footnotes
  - def_list
  - admonition
  - toc:
      toc_depth: 2

plugins:
  - search
  - mkdocstrings

nav:
  - "Home":
    - index.md
  - "Installation":
    - install.md
  - "Tutorials":
    - "Command Line":
      - "Introduction": tutorial_cli.md
      - "The gawp Command": tutorial_cli_command.md
      - "Configuration File": tutorial_cli_config.md
      - "Input Files": tutorial_cli_files.md
      - "Joins": tutorial_cli_join.md
      - "Output Files": tutorial_cli_output.md
      - "Review and Summary": tutorial_cli_summary.md
    - "Jupyter Notebook":
      - tutorial_jupyter.md
  - "Overview":
    - overview.md
    - config.md
    - manager_intro.md
  - "Plugins":
    - io.md
    - geometry.md
    - join.md
    - group.md
    - stages.md
    - manager.md
  - "Developer":
    - dev.md
